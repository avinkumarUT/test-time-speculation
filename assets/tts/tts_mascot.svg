<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" shape-rendering="geometricPrecision" role="img" aria-label="TTS mascot: an owl professor holds up a green check mark while a small owlet with a big pencil looks up at it; both stand on a row of tokens that turn from rejected to accepted">
  <defs>
    <!-- White sticker border: blur the silhouette and re-threshold it, which
         grows it evenly in every direction with smooth, anti-aliased edges. -->
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="soft"/>
      <feComponentTransfer in="soft" result="edge">
        <feFuncA type="linear" slope="26" intercept="-1.3"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="edge" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#sticker)" stroke="#1d2136" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

    <!-- token track: rejected early, accepted later -->
    <g>
      <rect x="37"  y="446" width="54" height="50" rx="13" fill="#e5534b"/>
      <rect x="101" y="446" width="54" height="50" rx="13" fill="#3fb97a"/>
      <rect x="165" y="446" width="54" height="50" rx="13" fill="#e5534b"/>
      <rect x="229" y="446" width="54" height="50" rx="13" fill="#3fb97a"/>
      <rect x="293" y="446" width="54" height="50" rx="13" fill="#3fb97a"/>
      <rect x="357" y="446" width="54" height="50" rx="13" fill="#3fb97a"/>
      <rect x="421" y="446" width="54" height="50" rx="13" fill="#3fb97a"/>
      <g fill="none" stroke="#ffffff" stroke-width="7">
        <path d="M54 461l20 20M74 461l-20 20"/>
        <path d="M115 472l10 10 18-22"/>
        <path d="M182 461l20 20M202 461l-20 20"/>
        <path d="M243 472l10 10 18-22"/>
        <path d="M307 472l10 10 18-22"/>
        <path d="M371 472l10 10 18-22"/>
        <path d="M435 472l10 10 18-22"/>
      </g>
    </g>

    <!-- the teacher: an owl professor (the target model) -->
    <g transform="translate(0 26)">
      <!-- ear tufts -->
      <path d="M92 160 L74 112 L124 134 Z" fill="#3f4a86"/>
      <path d="M288 160 L306 112 L256 134 Z" fill="#3f4a86"/>
      <!-- resting wing -->
      <ellipse cx="76" cy="318" rx="26" ry="72" transform="rotate(10 76 318)" fill="#323b6e"/>
      <!-- body -->
      <path d="M190 120 C290 120 320 220 316 300 C312 380 262 414 190 414 C118 414 68 380 64 300 C60 220 90 120 190 120 Z" fill="#3f4a86"/>
      <!-- belly -->
      <path d="M190 252 C244 252 262 300 258 344 C254 384 226 402 190 402 C154 402 126 384 122 344 C118 300 136 252 190 252 Z" fill="#fff3df"/>
      <g fill="none" stroke="#d6c7a8" stroke-width="5">
        <path d="M156 304q10 12 20 0"/><path d="M204 304q10 12 20 0"/>
        <path d="M180 334q10 12 20 0"/>
        <path d="M156 364q10 12 20 0"/><path d="M204 364q10 12 20 0"/>
      </g>
      <!-- feet -->
      <path d="M144 414q16 -12 32 0v8h-32z" fill="#f2a23a"/>
      <path d="M204 414q16 -12 32 0v8h-32z" fill="#f2a23a"/>
      <!-- eyes -->
      <circle cx="146" cy="208" r="38" fill="#ffffff"/>
      <circle cx="234" cy="208" r="38" fill="#ffffff"/>
      <g stroke="none">
        <circle cx="158" cy="216" r="16" fill="#1d2136"/>
        <circle cx="246" cy="216" r="16" fill="#1d2136"/>
        <circle cx="164" cy="209" r="5.5" fill="#ffffff"/>
        <circle cx="252" cy="209" r="5.5" fill="#ffffff"/>
      </g>
      <!-- glasses -->
      <g fill="none" stroke="#f2b632" stroke-width="8">
        <circle cx="146" cy="208" r="43"/>
        <circle cx="234" cy="208" r="43"/>
        <path d="M187 200Q190 194 193 200"/>
      </g>
      <!-- beak -->
      <path d="M190 232l14 12l-14 22l-14 -22z" fill="#f2a23a"/>
      <!-- mortarboard -->
      <path d="M132 128q58 -26 116 0v-16q-58 -26 -116 0z" fill="#2b3050"/>
      <path d="M94 96L190 60L286 96L190 132Z" fill="#1d2136"/>
      <path d="M190 96L258 110V140" fill="none" stroke="#f2b632" stroke-width="6"/>
      <path d="M249 138h18l4 24h-26z" fill="#f2b632"/>
      <circle cx="190" cy="96" r="7" fill="#f2b632"/>
      <!-- raised wing with the check sign -->
      <path d="M368 190L396 116" fill="none" stroke-width="16"/>
      <path d="M368 190L396 116" fill="none" stroke="#b5651d" stroke-width="8"/>
      <path d="M298 250C330 240 352 214 362 184L380 196C374 242 344 288 304 302Z" fill="#323b6e"/>
      <circle cx="404" cy="92" r="46" fill="#3fb97a"/>
      <path d="M383 94l15 15l29 -34" fill="none" stroke="#ffffff" stroke-width="11"/>
    </g>

    <!-- the student: an owlet with a big pencil (the speculator) -->
    <g transform="rotate(-5 392 372)">
      <!-- ear tufts -->
      <path d="M340 324L330 288L366 306Z" fill="#e07a2c"/>
      <path d="M444 324L454 288L418 306Z" fill="#e07a2c"/>
      <!-- body -->
      <path d="M392 296C444 296 462 344 460 384C458 424 430 442 392 442C354 442 326 424 324 384C322 344 340 296 392 296Z" fill="#e07a2c"/>
      <!-- belly -->
      <path d="M392 370C418 370 428 392 426 410C424 428 410 436 392 436C374 436 360 428 358 410C356 392 366 370 392 370Z" fill="#fff3df"/>
      <!-- wings -->
      <ellipse cx="330" cy="392" rx="14" ry="30" transform="rotate(14 330 392)" fill="#c4601a"/>
      <!-- pencil, held in the right wing -->
      <g transform="rotate(10 472 366)">
        <rect x="462" y="286" width="22" height="118" rx="4" fill="#f2b632"/>
        <rect x="462" y="286" width="22" height="22" rx="4" fill="#f08a9b"/>
        <path d="M462 404h22l-11 26z" fill="#fff3df"/>
        <path d="M469 420h8l-4 10z" fill="#1d2136" stroke-width="3"/>
      </g>
      <ellipse cx="458" cy="390" rx="15" ry="28" transform="rotate(-24 458 390)" fill="#c4601a"/>
      <!-- feet -->
      <path d="M364 442q10 -9 20 0v6h-20z" fill="#f2b632"/>
      <path d="M400 442q10 -9 20 0v6h-20z" fill="#f2b632"/>
      <!-- eyes, looking up at the check -->
      <circle cx="369" cy="340" r="24" fill="#ffffff"/>
      <circle cx="415" cy="340" r="24" fill="#ffffff"/>
      <g stroke="none">
        <circle cx="371" cy="331" r="11" fill="#1d2136"/>
        <circle cx="417" cy="331" r="11" fill="#1d2136"/>
        <circle cx="375" cy="326" r="4" fill="#ffffff"/>
        <circle cx="421" cy="326" r="4" fill="#ffffff"/>
      </g>
      <!-- beak -->
      <path d="M392 352l9 8l-9 13l-9 -13z" fill="#ffd166"/>
    </g>
  </g>
</svg>
